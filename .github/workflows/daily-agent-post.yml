name: Daily Agent Blog Post

on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Optional category tag, for example #DevOps"
        required: false
        type: string
      topic:
        description: "Optional exact topic"
        required: false
        type: string
      post_count:
        description: "Number of posts to generate"
        required: false
        default: "1"
        type: string
      dry_run:
        description: "Plan/generate without committing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-agent-post
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AGENT_CATEGORY: ${{ inputs.category }}
          AGENT_TOPIC: ${{ inputs.topic }}
          AGENT_POST_COUNT: ${{ inputs.post_count }}
          AGENT_DRY_RUN: ${{ inputs.dry_run }}
        run: npm run agent:post

      - name: Validate generated post quality
        if: ${{ inputs.dry_run != 'true' }}
        run: npm run agent:validate

      - name: Upload agent usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-usage
          path: public/agent-usage/latest.json
          if-no-files-found: ignore

      - name: Commit generated post
        if: ${{ inputs.dry_run != 'true' }}
        id: commit
        run: |
          created="$(node -p 'require("./public/agent-usage/latest.json").created || 0')"
          if [ "$created" = "0" ]; then
            git restore public/agent-usage/latest.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No post generated; skipping commit and deployment"
            exit 0
          fi
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
          git add public/posts public/images/posts public/agent-usage
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated post changes"
          else
            git commit -m "Add daily agent blog post"
            git push origin master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit usage report
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
          git add public/agent-usage
          if git diff --staged --quiet; then
            echo "No usage report changes"
          else
            git commit -m "Record agent usage report"
            git push origin master
          fi

      - name: Build site
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: npm run build

      - name: Upload Pages artifact
        if: ${{ steps.commit.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: generate
    if: ${{ needs.generate.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
