name: Daily Agent Blog Draft

on:
  schedule:
    # 08:00 and 18:00 Asia/Seoul (UTC+9)
    - cron: "0 23 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Optional category tag, for example #DevOps"
        required: false
        type: string
      topic:
        description: "Optional exact topic"
        required: false
        type: string
      post_count:
        description: "Number of drafts to generate, max 2"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: daily-agent-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AGENT_CATEGORY: ${{ inputs.category }}
          AGENT_TOPIC: ${{ inputs.topic }}
          AGENT_POST_COUNT: ${{ inputs.post_count }}
        run: npm run agent:post

      - name: Validate draft
        run: npm run agent:validate

      - name: Package draft for review
        run: node scripts/package-agent-drafts.mjs

      - name: Upload draft for review
        uses: actions/upload-artifact@v4
        with:
          name: blog-drafts
          path: review-drafts/
          if-no-files-found: ignore

      - name: Upload usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-usage
          path: .agent-usage/latest.json
          if-no-files-found: ignore
