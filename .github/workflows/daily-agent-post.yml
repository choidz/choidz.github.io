name: Daily Agent Blog Draft

on:
  schedule:
    # 08:00 and 18:00 Asia/Seoul (UTC+9)
    - cron: "0 23 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Optional category tag, for example #DevOps"
        required: false
        type: string
      topic:
        description: "Optional exact topic"
        required: false
        type: string
      post_count:
        description: "Number of drafts to generate, max 2"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-agent-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AGENT_CATEGORY: ${{ inputs.category }}
          AGENT_TOPIC: ${{ inputs.topic }}
          AGENT_POST_COUNT: ${{ inputs.post_count }}
        run: npm run agent:post

      - name: Validate draft
        run: npm run agent:validate

      - name: Check for new posts
        id: changes
        run: |
          if git diff --quiet -- public/posts/index.json &&
             [ -z "$(git ls-files --others --exclude-standard public/posts public/images/posts)" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.changes.outputs.published == 'true' && github.ref == 'refs/heads/master'
        run: npm run build

      - name: Publish generated posts
        if: steps.changes.outputs.published == 'true' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/posts/index.json public/posts public/images/posts
          git commit -m "Publish generated blog post $(date -u '+%Y-%m-%d')"
          git push origin HEAD:master

      - name: Upload Pages artifact
        if: steps.changes.outputs.published == 'true' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.published == 'true' && github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-usage
          path: .agent-usage/latest.json
          if-no-files-found: ignore
